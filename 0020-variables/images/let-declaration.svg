<svg xmlns="http://www.w3.org/2000/svg" width="464" height="176" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="464" height="176"></rect>
  <rect x="388" y="72" width="64" height="32" class="solid nofill" rx="4"></rect>
  <text x="402" y="92" >= 0</text>
  <rect x="60" y="72" width="64" height="32" class="solid nofill" rx="4"></rect>
  <text x="82" y="92" >let</text>
  <rect x="148" y="72" width="88" height="32" class="solid nofill" rx="4"></rect>
  <text x="162" y="92" >colorHue</text>
  <rect x="260" y="72" width="104" height="32" class="solid nofill" rx="4"></rect>
  <text x="274" y="92" >: number</text>
  <line x1="420" y1="16" x2="420" y2="52" class="solid"></line>
  <polygon points="416,52 424,52 420,64" class="filled"></polygon>
  <line x1="92" y1="32" x2="92" y2="52" class="solid"></line>
  <polygon points="88,52 96,52 92,64" class="filled"></polygon>
  <polygon points="184,124 188,112 192,124" class="filled"></polygon>
  <line x1="188" y1="124" x2="188" y2="144" class="solid"></line>
  <polygon points="304,124 308,112 312,124" class="filled"></polygon>
  <line x1="308" y1="124" x2="308" y2="160" class="solid"></line>
  <text x="10" y="12" >declares a variable:</text>
  <text x="226" y="12" >the first value in the box</text>
  <text x="10" y="28" >its value may be replaced</text>
  <text x="106" y="156" >the name you choose</text>
  <text x="250" y="172" >the data type</text>
</svg>