<svg xmlns="http://www.w3.org/2000/svg" width="632" height="176" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="632" height="176"></rect>
  <rect x="92" y="88" width="136" height="32" class="solid nofill" rx="4"></rect>
  <text x="106" y="108" >clickPositions</text>
  <rect x="348" y="88" width="120" height="32" class="solid nofill" rx="4"></rect>
  <text x="362" y="108" >width - 10</text>
  <rect x="492" y="88" width="128" height="32" class="solid nofill" rx="4"></rect>
  <text x="506" y="108" >height - 10</text>
  <rect x="12" y="88" width="56" height="32" class="solid nofill" rx="4"></rect>
  <text x="26" y="108" >text</text>
  <rect x="252" y="88" width="72" height="32" class="solid nofill" rx="4"></rect>
  <text x="266" y="108" >5, 5</text>
  <line x1="156" y1="16" x2="156" y2="68" class="solid"></line>
  <polygon points="152,68 160,68 156,80" class="filled"></polygon>
  <polygon points="400,68 408,68 404,80" class="filled"></polygon>
  <polygon points="552,68 560,68 556,80" class="filled"></polygon>
  <polygon points="32,140 36,128 40,140" class="filled"></polygon>
  <line x1="36" y1="140" x2="36" y2="160" class="solid"></line>
  <polygon points="280,140 284,128 288,140" class="filled"></polygon>
  <line x1="284" y1="140" x2="284" y2="160" class="solid"></line>
  <text x="74" y="12" >the string to draw</text>
  <text x="370" y="12" >the size of the text box</text>
  <text x="2" y="172" >the command</text>
  <text x="138" y="172" >the top left corner of the text box</text>
  <g>
    <line x1="476" y1="16" x2="476" y2="40" class="solid"></line>
    <path d="M 408,40 A 4,4 0,0,0 404,44" class="nofill"></path>
    <line x1="404" y1="44" x2="404" y2="68" class="solid"></line>
    <line x1="408" y1="40" x2="552" y2="40" class="solid"></line>
    <path d="M 552,40 A 4,4 0,0,1 556,44" class="nofill"></path>
    <line x1="556" y1="44" x2="556" y2="68" class="solid"></line>
  </g>
</svg>