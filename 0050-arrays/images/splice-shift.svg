<svg xmlns="http://www.w3.org/2000/svg" width="256" height="192" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="256" height="192"></rect>
  <text x="26" y="12" >before</text>
  <text x="42" y="76" >0</text>
  <text x="98" y="76" >1</text>
  <text x="154" y="76" >2</text>
  <text x="210" y="76" >3</text>
  <text x="26" y="108" >after</text>
  <text x="42" y="172" >0</text>
  <text x="98" y="172" >1</text>
  <text x="154" y="172" >2</text>
  <text x="82" y="12" >splice(1, 1)</text>
  <text x="34" y="44" >a</text>
  <text x="90" y="44" >b</text>
  <text x="146" y="44" >c</text>
  <text x="202" y="44" >d</text>
  <text x="74" y="108" >splice(1, 1)</text>
  <text x="34" y="140" >a</text>
  <text x="90" y="140" >c</text>
  <text x="146" y="140" >d</text>
  <g>
    <line x1="20" y1="24" x2="244" y2="24" class="solid"></line>
    <line x1="20" y1="24" x2="20" y2="56" class="solid"></line>
    <line x1="76" y1="24" x2="76" y2="56" class="solid"></line>
    <line x1="132" y1="24" x2="132" y2="56" class="solid"></line>
    <line x1="188" y1="24" x2="188" y2="56" class="solid"></line>
    <line x1="244" y1="24" x2="244" y2="56" class="solid"></line>
    <line x1="20" y1="56" x2="244" y2="56" class="solid"></line>
  </g>
  <g>
    <line x1="20" y1="120" x2="188" y2="120" class="solid"></line>
    <line x1="20" y1="120" x2="20" y2="152" class="solid"></line>
    <line x1="76" y1="120" x2="76" y2="152" class="solid"></line>
    <line x1="132" y1="120" x2="132" y2="152" class="solid"></line>
    <line x1="188" y1="120" x2="188" y2="152" class="solid"></line>
    <line x1="20" y1="152" x2="188" y2="152" class="solid"></line>
  </g>
</svg>