<svg xmlns="http://www.w3.org/2000/svg" width="344" height="208" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="344" height="208"></rect>
  <rect x="4" y="24" width="64" height="32" class="solid nofill" rx="0"></rect>
  <line x1="28" y1="40" x2="28" y2="40" class="solid end_marked_circle"></line>
  <rect x="4" y="152" width="64" height="32" class="solid nofill" rx="0"></rect>
  <line x1="28" y1="168" x2="28" y2="168" class="solid end_marked_circle"></line>
  <text x="18" y="12" >first</text>
  <polygon points="152,84 160,88 152,92" class="filled"></polygon>
  <text x="186" y="92" >10</text>
  <text x="242" y="92" >20</text>
  <text x="298" y="92" >30</text>
  <text x="186" y="124" >0</text>
  <text x="242" y="124" >1</text>
  <text x="298" y="124" >2</text>
  <text x="18" y="140" >second</text>
  <g>
    <line x1="32" y1="40" x2="120" y2="40" class="solid"></line>
    <path d="M 120,40 A 4,4 0,0,1 124,44" class="nofill"></path>
    <line x1="124" y1="44" x2="124" y2="164" class="solid"></line>
    <line x1="124" y1="88" x2="152" y2="88" class="solid"></line>
    <line x1="32" y1="168" x2="120" y2="168" class="solid"></line>
    <path d="M 124,164 A 4,4 0,0,1 120,168" class="nofill"></path>
  </g>
  <g>
    <line x1="164" y1="72" x2="332" y2="72" class="solid"></line>
    <line x1="164" y1="72" x2="164" y2="104" class="solid"></line>
    <line x1="220" y1="72" x2="220" y2="104" class="solid"></line>
    <line x1="276" y1="72" x2="276" y2="104" class="solid"></line>
    <line x1="332" y1="72" x2="332" y2="104" class="solid"></line>
    <line x1="164" y1="104" x2="332" y2="104" class="solid"></line>
  </g>
</svg>