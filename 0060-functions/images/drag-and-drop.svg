  <text x="34" y="28" >mousePressed</text>
  <text x="450" y="28" >mouseReleased</text>
  <text x="42" y="60" >did</text>
  <text x="74" y="60" >I</text>
  <text x="90" y="60" >grab</text>
  <text x="450" y="60" >is</text>
  <text x="474" y="60" >it</text>
  <text x="498" y="60" >inside</text>
  <text x="42" y="76" >the</text>
  <text x="74" y="76" >circle?</text>
  <text x="458" y="76" >the</text>
  <text x="490" y="76" >target?</text>
  <polygon points="288,108 292,96 296,108" class="filled"></polygon>
  <polygon points="80,132 88,132 84,144" class="filled"></polygon>
  <polygon points="496,132 504,132 500,144" class="filled"></polygon>
  <polygon points="592,148 600,152 592,156" class="filled"></polygon>
