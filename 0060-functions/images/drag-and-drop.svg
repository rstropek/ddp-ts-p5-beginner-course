  <text x="522" y="124" >sets it false</text>
  <g>
    <line x1="4" y1="8" x2="164" y2="8" class="solid"></line>
    <line x1="4" y1="8" x2="4" y2="88" class="solid"></line>
    <line x1="164" y1="8" x2="164" y2="88" class="solid"></line>
