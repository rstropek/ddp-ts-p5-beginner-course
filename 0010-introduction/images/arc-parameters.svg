<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" width="500" height="310" font-family="monospace" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <!-- dimension guides (dotted) -->
  <line x1="90" y1="170" x2="90" y2="48" stroke="#999" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="330" y1="170" x2="330" y2="48" stroke="#999" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="210" y1="80" x2="368" y2="80" stroke="#999" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="210" y1="260" x2="368" y2="260" stroke="#999" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- width dimension -->
  <line x1="90" y1="48" x2="330" y2="48" stroke="black" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="210" y="36" text-anchor="middle">width</text>

  <!-- height dimension -->
  <line x1="368" y1="80" x2="368" y2="260" stroke="black" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="380" y="175">height</text>

  <!-- the rest of the ellipse (not drawn by arc): from 180° clockwise up and over to 25° -->
  <path d="M 90 170 A 120 90 0 1 1 318.76 208.03" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- the drawn arc: start angle 25°, end angle 180°, clockwise -->
  <path d="M 318.76 208.03 A 120 90 0 0 1 90 170" fill="none" stroke="black" stroke-width="5"/>

  <!-- radius lines to start and end points -->
  <line x1="210" y1="170" x2="318.76" y2="208.03" stroke="black" stroke-width="1"/>
  <line x1="210" y1="170" x2="90" y2="170" stroke="black" stroke-width="1"/>

  <!-- center -->
  <circle cx="210" cy="170" r="4" fill="black"/>
  <text x="210" y="155" text-anchor="middle">(x, y)</text>

  <!-- angle labels -->
  <text x="330" y="232">start angle</text>
  <text x="8" y="195">end angle</text>

  <!-- pointer to the drawn part -->
  <line x1="210" y1="283" x2="210" y2="266" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="210" y="300" text-anchor="middle">the drawn part</text>
</svg>
