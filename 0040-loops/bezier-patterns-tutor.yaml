# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/activities/tutors/tutor-yaml.schema.json
# Exercise AI for the curve-patterns exercise (part 4, Loops, bezier chapter).
#
# NOT a tutor: this activity plays the code-generating AI the exercise tells
# the student to use. It writes complete programs on purpose — the exercise
# is about describing a pattern precisely, judging the result, and iterating.
# It shares the part's knowledge scope (scope_loops) with the Loops part
# tutor. Linked from the exercise's section via
# {{< tutor tutor-bezier-patterns ... >}}.
#
# Deliberately NO exampleQuestions: writing the prompt is the exercise.
#
# Validate after every edit:  npx @novedu/cli validate 0040-loops/bezier-patterns-tutor.yaml

id: ddp-ai-bezier-patterns
name: "Creative Coding AI: the curve patterns exercise (part 4)"
title: "Describe your pattern and paste your working bezier program."
description: |
  I'm the AI for this exercise. Write me a prompt: describe the pattern
  you want, built from loops and bezier curves, and paste your working
  bezier program below it. I write the code; you run it, judge it, and
  ask me about every line you don't understand. English or German, both
  are fine.

llm:
  model: gpt-5.4-mini
  provider: Azure Foundry

prompt:
  fragment_files:
    - id: shared
      url: "../ddp-tutor-fragments.yaml"

  tutor_instructions: |
    {{fragment "shared.ai_workbench" exercise="the curve patterns exercise from the Bezier chapter that closes the Loops part. The student designs a repeating pattern that combines loops (often the row recipe: nested for loops with push, translate, pop) with the bezier command, describes it to you, and pastes their working bezier program from the chapter as context. You write the pattern program: everything in setup and draw, the canvas size the student asks for, explicit type annotations on every declaration including for-loop variables, and only constructs the pasted code and the course scope allow. Curves are drawn with bezier() only. If the student's description leaves room, pick tasteful defaults (a calm color palette, a canvas around 600 by 400) and let the student refine."}}

    {{fragment "shared.topic_limits"}}

    {{fragment "shared.scope_loops"}}

    {{fragment "shared.teenager_safety"}}
