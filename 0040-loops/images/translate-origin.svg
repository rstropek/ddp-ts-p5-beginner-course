<svg xmlns="http://www.w3.org/2000/svg" width="336" height="320" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="336" height="320"></rect>
  <rect x="140" y="200" width="48" height="32" class="solid nofill" rx="8"></rect>
  <text x="82" y="12" >the</text>
  <text x="114" y="12" >old</text>
  <text x="146" y="12" >origin</text>
  <line x1="36" y1="28" x2="36" y2="24" class="solid end_marked_open_circle"></line>
  <line x1="40" y1="24" x2="304" y2="24" class="solid"></line>
  <polygon points="304,20 312,24 304,28" class="filled"></polygon>
  <line x1="36" y1="32" x2="36" y2="276" class="solid"></line>
  <polygon points="32,276 40,276 36,288" class="filled"></polygon>
  <text x="34" y="300" >y</text>
  <text x="322" y="28" >x</text>
  <text x="66" y="76" >translate</text>
  <path d="M 144,64 A 16,16 0,0,0 144,80" class="nofill"></path>
  <text x="146" y="76" >100,</text>
  <line x1="80" y1="80" x2="108" y2="136" class="solid end_marked_open_circle"></line>
  <line x1="108" y1="140" x2="108" y2="260" class="solid"></line>
  <line x1="112" y1="136" x2="272" y2="136" class="solid"></line>
  <polygon points="272,132 280,136 272,140" class="filled"></polygon>
  <polygon points="104,260 112,260 108,272" class="filled"></polygon>
  <text x="106" y="284" >y</text>
  <text x="186" y="76" >100</text>
  <path d="M 208,64 A 16,16 0,0,1 208,80" class="nofill"></path>
  <text x="290" y="140" >x</text>
  <text x="162" y="188" >circle</text>
  <path d="M 216,176 A 16,16 0,0,0 216,192" class="nofill"></path>
  <text x="218" y="188" >0,</text>
  <text x="242" y="188" >0,</text>
  <text x="266" y="188" >50</text>
  <path d="M 280,176 A 16,16 0,0,1 280,192" class="nofill"></path>
  <text x="210" y="220" >draws</text>
  <text x="258" y="220" >here</text>
  <text x="298" y="220" >now</text>
  <text x="10" y="12" >(0,0)</text>
  <text x="130" y="156" >the new (0,0)</text>
</svg>