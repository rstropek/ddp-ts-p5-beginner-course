      note: "Creative Coding book: dedicated number conversion tutor (0030-conditions/0050) — GitHub-hosted"

    # Exercise AIs: the code-generating counterparts for the book's
    # designated AI exercises (the part tutors stay strictly hint-only).
    tutor-elephant:
