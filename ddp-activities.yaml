# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/activities/registry/registry-yaml.schema.json
# Activity registry for the Creative Coding book.
#
# Every novedu activity a chapter links to is listed here under a stable KEY;
# the chapters reference that key, never a code:
#
#     {{< quiz number-systems title="Number systems" >}}
#
# Reconcile it with novedu and regenerate the lock file with:
#
#     npx @novedu/cli codes sync ddp-activities.yaml
#
# An entry whose file, window, and model override are unchanged keeps its code,
# so re-running is routine. Adding an activity = one new entry here + one sync run;
# commit BOTH this file and ddp-activities.lock.yaml. Full format reference:
# https://github.com/Teaching-HTL-Leonding/novedu-chat-mvp/blob/main/docs/registry.md

# novedu re-reads the activity YAML from this repository's raw URLs on every
# load, so publishing a quiz or tutor edit stays a plain `git push`.
base-url: "https://raw.githubusercontent.com/rstropek/ddp-ts-p5-beginner-course/refs/heads/main/"

activities:
  # Each part has a general AI tutor. A chapter can also have a dedicated
  # tutor when a focused practice workflow needs different instructions.
  tutors:
    tutor-introduction:
      file: 0010-introduction/introduction-tutor.yaml
      note: "Creative Coding book: AI tutor for part 1, Introduction — GitHub-hosted"
    tutor-variables:
      file: 0020-variables/variables-tutor.yaml
      note: "Creative Coding book: AI tutor for part 2, Variables — GitHub-hosted"
    tutor-conditions:
      file: 0030-conditions/conditions-tutor.yaml
      note: "Creative Coding book: AI tutor for part 3, Conditions — GitHub-hosted"
    tutor-number-conversions:
