  <text x="162" y="220" >to</text>
  <text x="186" y="220" >cut</text>
  <text x="450" y="204" >where</text>
  <text x="498" y="204" >to</text>
  <text x="522" y="204" >draw</text>
  <text x="450" y="220" >how</text>
  <text x="482" y="220" >big</text>
  <text x="514" y="220" >to</text>
  <text x="538" y="220" >draw</text>
  <text x="250" y="92" >copy</text>
  <text x="18" y="204" >sx, sy</text>
  <text x="370" y="204" >dx, dy</text>
  <text x="18" y="220" >sw, sh</text>
  <text x="370" y="220" >dw, dh</text>
  <g>
    <line x1="20" y1="24" x2="188" y2="24" class="solid"></line>
    <line x1="20" y1="24" x2="20" y2="168" class="solid"></line>
    <line x1="76" y1="24" x2="76" y2="168" class="solid"></line>
