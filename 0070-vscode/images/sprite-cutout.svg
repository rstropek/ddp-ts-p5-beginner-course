    <line x1="188" y1="24" x2="188" y2="168" class="solid"></line>
    <line x1="20" y1="72" x2="188" y2="72" class="solid"></line>
    <line x1="20" y1="120" x2="188" y2="120" class="solid"></line>
    <line x1="20" y1="168" x2="188" y2="168" class="solid"></line>
  </g>
</svg>