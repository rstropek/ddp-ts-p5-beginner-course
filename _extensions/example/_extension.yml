title: Example
author: CS Basics Course
version: 1.0.0
quarto-required: ">=1.4.0"
# When the project has this extension installed (i.e. the `_extensions/example/`
# folder exists), Quarto makes the `{{< example ... >}}` and
# `{{< playground ... >}}` shortcodes available in any .qmd.
contributes:
  shortcodes:
    - example.lua      # provides both `example` and `playground` shortcodes

# PDF output needs the LaTeX packages `qrcode` (the printed QR code),
# `inconsolata` (the font the printed address is set in), and `needspace`
# (keeps the complete card away from a page boundary). TinyTeX installs them
# on the first render; a full TeX Live already has them.
