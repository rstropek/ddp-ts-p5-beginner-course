title: Quiz
author: CS Basics Course
version: 1.0.0
quarto-required: ">=1.4.0"
# When the project has this extension installed (i.e. the `_extensions/quiz/`
# folder exists), Quarto makes the `{{< quiz ... >}}` shortcode available in
# any .qmd.
contributes:
  shortcodes:
    - quiz.lua

# PDF output needs the LaTeX packages `qrcode` (the printed QR code) and
# `inconsolata` (the font the printed address is set in). TinyTeX installs both
# on the first render; a full TeX Live already has them.
