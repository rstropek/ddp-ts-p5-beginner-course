<svg xmlns="http://www.w3.org/2000/svg" width="328" height="176" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="328" height="176"></rect>
  <rect x="36" y="72" width="32" height="32" class="solid nofill" rx="4"></rect>
  <text x="50" y="92" >3</text>
  <rect x="124" y="72" width="32" height="32" class="solid nofill" rx="4"></rect>
  <text x="138" y="92" >5</text>
  <rect x="212" y="72" width="32" height="32" class="solid nofill" rx="4"></rect>
  <text x="226" y="92" >2</text>
  <line x1="52" y1="32" x2="52" y2="52" class="solid"></line>
  <polygon points="48,52 56,52 52,64" class="filled"></polygon>
  <line x1="52" y1="112" x2="52" y2="132" class="solid"></line>
  <polygon points="48,132 56,132 52,144" class="filled"></polygon>
  <line x1="140" y1="32" x2="140" y2="52" class="solid"></line>
  <polygon points="136,52 144,52 140,64" class="filled"></polygon>
  <line x1="140" y1="112" x2="140" y2="132" class="solid"></line>
  <polygon points="136,132 144,132 140,144" class="filled"></polygon>
  <line x1="228" y1="32" x2="228" y2="52" class="solid"></line>
  <polygon points="224,52 232,52 228,64" class="filled"></polygon>
  <line x1="228" y1="112" x2="228" y2="132" class="solid"></line>
  <polygon points="224,132 232,132 228,144" class="filled"></polygon>
  <text x="298" y="156" >352</text>
  <text x="2" y="12" >hundreds</text>
  <text x="114" y="12" >tens</text>
  <text x="202" y="12" >ones</text>
  <text x="34" y="28" >100</text>
  <text x="122" y="28" >10</text>
  <text x="218" y="28" >1</text>
  <text x="18" y="156" >3 * 100  +  5 * 10  +  2 * 1  =</text>
</svg>