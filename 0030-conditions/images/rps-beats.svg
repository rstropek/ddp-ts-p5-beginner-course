<svg xmlns="http://www.w3.org/2000/svg" width="424" height="112" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="424" height="112"></rect>
  <text x="90" y="12" >crushes</text>
  <text x="290" y="12" >cuts</text>
  <text x="26" y="28" >rock</text>
  <polygon points="160,20 168,24 160,28" class="filled"></polygon>
  <text x="186" y="28" >scissors</text>
  <polygon points="336,20 344,24 336,28" class="filled"></polygon>
  <text x="362" y="28" >paper</text>
  <polygon points="32,60 36,48 40,60" class="filled"></polygon>
  <text x="186" y="76" >covers</text>
  <g>
    <line x1="12" y1="8" x2="68" y2="8" class="solid"></line>
    <line x1="12" y1="8" x2="12" y2="40" class="solid"></line>
    <line x1="68" y1="8" x2="68" y2="40" class="solid"></line>
    <line x1="68" y1="24" x2="160" y2="24" class="solid"></line>
    <line x1="12" y1="40" x2="68" y2="40" class="solid"></line>
  </g>
  <g>
    <line x1="172" y1="8" x2="260" y2="8" class="solid"></line>
    <line x1="172" y1="8" x2="172" y2="40" class="solid"></line>
    <line x1="260" y1="8" x2="260" y2="40" class="solid"></line>
    <line x1="260" y1="24" x2="336" y2="24" class="solid"></line>
    <line x1="172" y1="40" x2="260" y2="40" class="solid"></line>
  </g>
  <g>
    <line x1="348" y1="8" x2="412" y2="8" class="solid"></line>
    <line x1="348" y1="8" x2="348" y2="40" class="solid"></line>
    <line x1="412" y1="8" x2="412" y2="40" class="solid"></line>
    <line x1="348" y1="40" x2="412" y2="40" class="solid"></line>
    <line x1="380" y1="40" x2="380" y2="88" class="solid"></line>
    <line x1="36" y1="60" x2="36" y2="88" class="solid"></line>
    <line x1="36" y1="88" x2="380" y2="88" class="solid"></line>
  </g>
</svg>