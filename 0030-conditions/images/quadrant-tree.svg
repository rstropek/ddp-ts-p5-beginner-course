<svg xmlns="http://www.w3.org/2000/svg" width="488" height="208" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: black;
}

.svgbob .bg_filled {
  fill: white;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: white;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="488" height="208"></rect>
  <rect x="148" y="8" width="200" height="32" class="solid nofill" rx="4"></rect>
  <text x="162" y="28" >mouseX &lt; width / 2 ?</text>
  <rect x="28" y="104" width="208" height="32" class="solid nofill" rx="4"></rect>
  <text x="42" y="124" >mouseY &lt; height / 2 ?</text>
  <rect x="268" y="104" width="208" height="32" class="solid nofill" rx="4"></rect>
  <text x="282" y="124" >mouseY &lt; height / 2 ?</text>
  <line x1="180" y1="48" x2="180" y2="84" class="solid"></line>
  <polygon points="176,84 184,84 180,96" class="filled"></polygon>
  <line x1="308" y1="48" x2="308" y2="84" class="solid"></line>
  <polygon points="304,84 312,84 308,96" class="filled"></polygon>
  <line x1="60" y1="144" x2="60" y2="180" class="solid"></line>
  <polygon points="56,180 64,180 60,192" class="filled"></polygon>
  <line x1="172" y1="144" x2="172" y2="180" class="solid"></line>
  <polygon points="168,180 176,180 172,192" class="filled"></polygon>
  <line x1="300" y1="144" x2="300" y2="180" class="solid"></line>
  <polygon points="296,180 304,180 300,192" class="filled"></polygon>
  <line x1="412" y1="144" x2="412" y2="180" class="solid"></line>
  <polygon points="408,180 416,180 412,192" class="filled"></polygon>
  <text x="114" y="76" >true</text>
  <text x="330" y="76" >false</text>
  <text x="10" y="172" >true</text>
  <text x="178" y="172" >false</text>
  <text x="250" y="172" >true</text>
  <text x="418" y="172" >false</text>
  <text x="34" y="204" >Orange</text>
  <text x="146" y="204" >Blue</text>
  <text x="274" y="204" >Green</text>
  <text x="394" y="204" >Red</text>
</svg>